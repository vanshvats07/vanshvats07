<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">Vansh Vats — CSE AI student, full-stack developer and aspiring ML engineer</title>
<desc id="desc">A dark terminal-inspired profile banner. An abstract character-based visual map appears on the left, with profile information, engineering focus, technologies, projects and links on the right.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914" /><stop offset=".55" stop-color="#0a1426" /><stop offset="1" stop-color="#10112a" /></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6" /><stop offset=".52" stop-color="#22d3ee" /><stop offset="1" stop-color="#34d399" /></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17243a" stop-opacity=".82" /><stop offset="1" stop-color="#0d1728" stop-opacity=".62" /></linearGradient>
  <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".18" /><stop offset="1" stop-color="#22d3ee" stop-opacity="0" /></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8ba4c7" stroke-opacity=".075" stroke-width="1" /></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12" /></filter>
  <clipPath id="frame"><rect x="12" y="12" width="1156" height="586" rx="22" /></clipPath>
  <clipPath id="portrait-frame"><rect x="75" y="148" width="308" height="250" rx="12" /></clipPath>
</defs>
